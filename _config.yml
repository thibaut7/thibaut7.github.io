# ─────────────────────────────────────────────────────────────
#  Réglages du site — c'est ici que tu changes tes informations.
#  Après une modification de ce fichier, GitHub reconstruit le
#  site tout seul (1 à 2 minutes).
# ─────────────────────────────────────────────────────────────

title: "Komlan Thibaut Bassa"
# Le nom tel qu'il s'affiche en grand (<br> = retour à la ligne)
nom_affiche: "Komlan Thibaut<br>Bassa"
initiales: "K. T. B."
# Langue principale du site : anglais. La version française est sous /fr/.
lang: en
timezone: Europe/Paris

# Phrase d'accroche sous ton nom (à compléter, en anglais et en français)
accroche:
  en: "I study robotics and autonomous systems at UTBM, I build things and I write to understand."
  fr: "J'étudie la robotique et les systèmes autonomes à l'UTBM, je construis des choses et j'écris pour comprendre."
# Ligne sur le stage (à compléter ; mets "" pour la masquer)
stage:
  en: "Looking for a 6-month final-year internship in robotics, computer vision and AI — from February 2027."
  fr: "À la recherche d'un stage de fin d'études de 6 mois en robotique, vision par ordinateur et IA — à partir de février 2027."

# Portrait : soit un lien complet vers une image (ici ta photo GitHub,
# qui suit automatiquement tes changements), soit le nom d'un fichier
# mis dans assets/img/ (ex. "portrait.jpg"). Vide = médaillon avec l'initiale.
portrait: "https://avatars.githubusercontent.com/u/86150292?s=400&v=4"

# Contact
email: "komlan.bassa1@utbm.fr"
github: "https://github.com/thibaut7"
linkedin: "https://www.linkedin.com/in/thibaut7"
# CV à télécharger, un par langue (les PDF sont dans assets/cv/)
cv:
  en: "assets/cv/CV-Komlan-Thibaut-Bassa-EN.pdf"
  fr: "assets/cv/CV-Komlan-Thibaut-Bassa-FR.pdf"

# Description pour Google et les aperçus de liens
description:
  en: "Portfolio of Komlan Thibaut Bassa: projects, writing and reading."
  fr: "Portfolio de Komlan Thibaut Bassa : projets, écrits et lectures."

# ── Carte des visiteurs (Supabase) ───────────────────────────
# URL du projet et clé « publishable » (ou « anon ») : faites pour être publiques.
# Vides = pas de suivi, la page Visitors affiche « bientôt ».
supabase_url: "https://nvvpszewsoupcqezdbdl.supabase.co"
supabase_cle: "sb_publishable_dc90eNj1yeCvad9va9IYPA_1Ns0wepj"

# ── Écrits ───────────────────────────────────────────────────
# Chaque fichier de _posts/ devient une page à l'adresse /writing/<titre>/
permalink: /writing/:title/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: ecrit
      lang: en    # mets "lang: fr" dans l'en-tête d'un écrit en français
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: true

exclude:
  - README.md
  - GUIDE-ECRITS.md
  - Gemfile
  - Gemfile.lock
  - vendor
